<svg width={L.field.w} height={L.field.h} viewBox={`0 0 ${L.field.w} ${L.field.h}`} style={{position:'absolute',inset:0}} aria-hidden="true">
        <defs><mask id="apa-exterior-mask"><rect width={L.field.w} height={L.field.h} fill="white"/><circle cx={L.field.cx} cy={L.field.cy} r={L.field.r} fill="black"/></mask><clipPath id="apa-boundary-clip"><circle cx={L.field.cx} cy={L.field.cy} r={L.field.r*boundaryP}/></clipPath></defs>
        {!biasPhase&&ms>=cue.outside&&<rect data-exterior-shade="true" {...shapeAttrs('exterior-shade',L.field,'frame')} width={L.field.w} height={L.field.h} fill={color('color/surface/well')} opacity={.35*outsideP} mask="url(#apa-exterior-mask)"/>}
        {ms>=cue.ingroup&&!biasPhase&&<g data-token-lattice="true" clipPath="url(#apa-boundary-clip)" opacity={boundaryP}>
          {[-72,0,72].map(dy=>[-108,-36,36,108].map(dx=><line key={`lat-line-${dx}-${dy}`} x1={L.field.cx-150} y1={L.field.cy+dy} x2={L.field.cx+150} y2={L.field.cy+dy} stroke={color('color/line/graticule')} strokeWidth="1"/>))}
          {[-108,-36,36,108].map(dx=>[-72,0,72].map(dy=><line key={`lat-line-v-${dx}-${dy}`} x1={L.field.cx+dx} y1={L.field.cy-110} x2={L.field.cx+dx} y2={L.field.cy+110} stroke={color('color/line/graticule')} strokeWidth="1"/>))}
          {[-72,0,72].flatMap((dy,row)=>[-108,-36,36,108].map((dx,col)=>{const n=row*4+col+1,x=L.field.cx+dx,y=L.field.cy+dy;return <circle key={n} data-lattice-token={n} cx={x} cy={y} r="8" fill={color('color/fill/gold')} fillOpacity=".55" stroke={color('color/line/hairline-strong')} strokeWidth="1.5"/>;}))}
        </g>}
        {ms>=cue.ingroup&&<circle data-group-boundary="true" {...shapeAttrs('group-boundary',boundaryBox,'frame')} cx={L.field.cx} cy={L.field.cy} r={L.field.r*boundaryP} fill={color('color/fill/gold-wash')} fillOpacity={.7*boundaryP} stroke={color('color/fill/gold')} strokeWidth="3" opacity={boundaryP}/>}
        {ms>=cue.ingroup&&!biasPhase&&<g data-outgoing-arrows="true" opacity={boundaryP} stroke={color('color/fill/gold')} fill={color('color/fill/gold')}>
          <g data-outgoing-arrow="east"><line x1={L.field.cx+190} y1={L.field.cy} x2={L.field.cx+268} y2={L.field.cy} strokeWidth="3"/><polygon stroke="none" points={`${L.field.cx+286},${L.field.cy} ${L.field.cx+268},${L.field.cy-8} ${L.field.cx+268},${L.field.cy+8}`}/></g>
          <g data-outgoing-arrow="north-east"><line x1={L.field.cx+131} y1={L.field.cy-131} x2={L.field.cx+186} y2={L.field.cy-186} strokeWidth="3"/><polygon stroke="none" points={`${L.field.cx+199},${L.field.cy-199} ${L.field.cx+182},${L.field.cy-196} ${L.field.cx+196},${L.field.cy-182}`}/></g>
          <g data-outgoing-arrow="south-east"><line x1={L.field.cx+131} y1={L.field.cy+131} x2={L.field.cx+186} y2={L.field.cy+186} strokeWidth="3"/><polygon stroke="none" points={`${L.field.cx+199},${L.field.cy+199} ${L.field.cx+196},${L.field.cy+182} ${L.field.cx+182},${L.field.cy+196}`}/></g>
        </g>}
        {!biasPhase&&ms>=cue.membership&&APA_MARKS.filter(mark=>mark.own&&!mark.center).map(mark=>{const x=mark.initialX+(mark.finalX-mark.initialX)*sortP,y=mark.initialY+(mark.finalY-mark.initialY)*sortP;
            // Each tie stops at the figures' edges (centre mark 38 px, member 30 px) so no line crosses a person.
            const length=Math.hypot(x-L.field.cx,y-L.field.cy)||1,t0=Math.min(.45,38/length),t1=Math.max(.55,1-30/length);
            const at=(t:number):[number,number]=>[L.field.cx+(x-L.field.cx)*t,L.field.cy+(y-L.field.cy)*t];
            const [x1,y1]=at(t0),[x2,y2]=at(t1),points:Point[]=[[cx+(x1-L.field.cx),cy+(y1-L.field.cy)],[cx+(x2-L.field.cx),cy+(y2-L.field.cy)]];
            return <line key={mark.id} data-membership-token={mark.id} {...lineAttrs(`membership-${mark.id}`,points)} x1={x1} y1={y1} x2={x2} y2={y2} stroke={color('color/fill/gold')} strokeWidth="1.5" opacity={.55*membershipP}/>;})}
        {ms>=cue.outgroup&&APA_MARKS.filter(mark=>!mark.own).map(mark=>{const x=mark.initialX+(mark.finalX-mark.initialX)*sortP,y=mark.initialY+(mark.finalY-mark.initialY)*sortP;return <circle key={mark.id} data-outgroup-outline={mark.id} cx={x} cy={y} r="25" fill="none" stroke={color('color/text/primary')} strokeWidth="2" opacity={outgroupP}/>;})}
        {!biasPhase&&ms>=cue.identification&&<circle data-identification-ring="true" {...lineAttrs('identification-ring',[[cx-74,cy],[cx,cy-74],[cx+74,cy],[cx,cy+74],[cx-74,cy]])} cx={L.field.cx} cy={L.field.cy} r={54+20*identificationP} fill="none" stroke={color('color/line/hairline-strong')} strokeWidth="3" opacity={identificationP}/>}
        {!biasPhase&&ms>=cue.detachment&&<path {...lineAttrs('detachment-line',detachmentLine)} d={`M${L.field.cx+L.field.r-22} ${L.field.cy-100}L620 135`} stroke={color('color/text/muted')} strokeWidth="3" opacity={detachmentP}/>}
        {!biasPhase&&ms>=cue.competition&&<><path {...lineAttrs('competition-out',competitionOne)} d={`M${L.field.cx+L.field.r-10} ${L.field.cy+50}H650`} stroke={color('color/marker/race')} strokeWidth="3" opacity={competitionP}/><path {...lineAttrs('competition-in',competitionTwo)} d={`M650 ${L.field.cy+78}H${L.field.cx+L.field.r-10}`} stroke={color('color/marker/race')} strokeWidth="3" opacity={competitionP}/></>}
        {!biasPhase&&ms>=cue.opposition&&<path {...lineAttrs('opposition-line',oppositionLine)} d={`M${L.field.cx+L.field.r-10} ${L.field.cy+155}L650 ${L.field.cy+180}`} stroke={color('color/marker/race')} strokeWidth="4" opacity={oppositionP}/>}
        {biasPhase&&ms>=cue.tendency&&<path data-tendency-arrow="true" {...lineAttrs('tendency-arrow',[[L.field.x+780,L.field.y+80],[L.field.x+620,L.field.y+72],[L.field.x+525,L.field.y+160]])} d="M780 80C675 50 585 72 525 160" fill="none" stroke={color('color/fill/gold')} strokeWidth="6" opacity={tendencyP}/>}
      </svg>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" style={{position:'absolute',inset:0}}><path {...lineAttrs('membership-leader',[[1040,624],[1120,595]])} d="M1040 624L1120 595" stroke={color('color/fill/gold')} strokeWidth="2" opacity={membershipP}/></svg>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" style={{position:'absolute',inset:0}}><path {...lineAttrs('identification-leader',[[1270,610],[1200,595]])} d="M1270 610L1200 595" stroke={color('color/fill/gold')} strokeWidth="2" opacity={identificationP}/></svg>