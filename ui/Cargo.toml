[package]
name = "scriptcast-ui"
version = "0.21.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
libc = "0.2"

regex = "1"
rfd = "0.17.2"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
soundcraft-audio-io = { git = "https://github.com/storytold/soundcraft", rev = "f3a19480d8cc2d7a98cda492f5464d8c54558c9f" }
soundcraft-dsp = { git = "https://github.com/storytold/soundcraft", rev = "f3a19480d8cc2d7a98cda492f5464d8c54558c9f" }
serde_json = "1.0.151"
sha2 = "0.11"
toml = "1.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
