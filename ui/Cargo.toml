[package]
name = "scriptcast-ui"
version = "0.20.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
libc = "0.2"

regex = "1"
rfd = "0.17.2"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
toml = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
