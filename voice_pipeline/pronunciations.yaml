# Spellings handed to text-reading TTS engines (OmniVoice, Chatterbox) so a
# heteronym comes out in the reading its context calls for.
#
#   word:
#     <misaki reading key>: <spelling sent to the engine>
#
# The reading key is whichever key misaki's lexicon uses for that reading
# ("default", "verb", "noun", "adj", "vbd", ...). `find_heteronyms` in
# pronunciation.py reports it for any sentence.
#
# Add an entry only after calibrating it:
#   python3 tools/calibrate_pronunciation.py record --reading default \
#       --candidates reckerd,RECK-erd --takes 6
# The script, captions and verification always keep the real word.

record:
  default: reckerd   # the noun, REC-ord
  verb: ree-CORD
