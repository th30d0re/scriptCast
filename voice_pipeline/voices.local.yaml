# On-device preview voices. No network, no ElevenLabs credits.
# Use with: python -m voice_pipeline --voices voice_pipeline/voices.local.yaml ...
# The committed voices.yaml stays the ElevenLabs configuration for final renders.
#
# Toussaint and Aisha use Emmanuel's own cloned references in voices/ via
# MLX Chatterbox. Emmanuel has no reference file, so he runs on MLX Kokoro.
speakers:
  emmanuel_theodore:
    name: "Emmanuel Theodore"
    engine: "mlx_kokoro"
    kokoro_voice: "am_adam"
    lang_code: "a"
    speed: 1.0
    character_profile: "Host and author of The Original Power"

  toussaint:
    name: "Toussaint"
    engine: "mlx_chatterbox"
    reference_audio: "voices/toussaint_reference.wav"
    speed: 1.0
    character_profile: "Co-narrator, historical and structural throughline"

  aisha:
    name: "Aisha"
    engine: "mlx_chatterbox"
    reference_audio: "voices/aisha_reference.wav"
    speed: 1.0
    character_profile: "Co-narrator, mathematical and empirical throughline"
